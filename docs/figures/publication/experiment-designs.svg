'middle' font-size='12' fill='#182026'>Archived probes and answers are frozen</text><path d='M 1060 207 V 226' stroke='#87949a' stroke-width='2' marker-end='url(#arrow)'/><circle cx='1010' cy='258' r='6' fill='#b94736'/><circle cx='1035' cy='258' r='6' fill='#b94736'/><circle cx='1060' cy='258' r='6' fill='#b94736'/><text x='1060' y='322' text-anchor='middle' font-size='12' fill='#182026'>Three judges rank them independently</text><path d='M 1060 330 V 338' stroke='#87949a' stroke-width='2' marker-end='url(#arrow)'/><circle cx='1025' cy='357' r='14' fill='#247665'/><circle cx='1060' cy='357' r='14' fill='#247665'/><circle cx='1095' cy='357' r='14' fill='#247665'/><text x='1060' y='401' text-anchor='middle' font-size='12' fill='#182026'>Pairwise majority combines their rankings</text><line x1='930' y1='428' x2='1205' y2='428' stroke='#9b6a18' stroke-width='3'/><circle cx='955' cy='451' r='8' fill='#9b6a18'/><circle cx='1020' cy='451' r='8' fill='#9b6a18'/><circle cx='1085' cy='451' r='8' fill='#9b6a18'/><circle cx='1150' cy='451' r='8' fill='#9b6a18'/>
