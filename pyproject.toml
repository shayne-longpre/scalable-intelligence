[project]
name = "ai-council"
version = "0.1.0"
description = "Infrastructure for blind councils of AI systems evaluating intelligence."
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1"]
readme = "README.md"
license = { text = "MIT" }

[project.scripts]
ai-council = "ai_council.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ai_council*"]
